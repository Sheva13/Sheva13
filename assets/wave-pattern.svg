    <path d="M-60 380C180 320 340 440 560 380C780 320 940 440 1160 380C1380 320 1540 440 1660 380" stroke-width="0.8" opacity="0.32"/>
    <path d="M-60 430C180 370 340 490 560 430C780 370 940 490 1160 430C1380 370 1540 490 1660 430" stroke-width="1" opacity="0.4"/>
