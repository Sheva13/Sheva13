      <stop offset="0.5" stop-color="#76C9D7" stop-opacity="0.7"/>
      <stop offset="0.82" stop-color="#287FA5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#287FA5" stop-opacity="0"/>
